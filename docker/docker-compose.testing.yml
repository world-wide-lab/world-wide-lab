services:
  db:
    image: postgres:15
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: wwl
      # Note: These are example credentials, you MUST change these before deploying anything
      POSTGRES_USER: example_db_user
      POSTGRES_PASSWORD: example_db_password
    # The server exits when it cannot reach the database on startup, and unlike
    # in docker-compose.yml there is no restart policy here to paper over it.
    # Waiting for postgres to actually accept connections keeps the run from
    # depending on which of the two containers wins the race.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U example_db_user -d wwl"]
      interval: 1s
      timeout: 5s
      retries: 30

  wwl-server:
    # Which image to test, so that CI can point this at the image it just built
    image: ${WWL_SERVER_IMAGE:-ghcr.io/world-wide-lab/server:latest}
    ports:
      - 8787:8787
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Note: These are example credentials, you MUST change these before deploying anything
      DATABASE_URL: "postgresql://example_db_user:example_db_password@db:5432/wwl"
      ADMIN_AUTH_DEFAULT_EMAIL: "admin@admin.com"
      ADMIN_AUTH_DEFAULT_PASSWORD: "admin"
      ADMIN_AUTH_SESSION_SECRET: "asdfgh12345"
      DEFAULT_API_KEY: "DEFAULT_API_KEY"
    # The image's own HEALTHCHECK only starts reporting after 30s, which is a
    # sensible interval for a long-running deployment but not for a test run
    healthcheck:
      interval: 1s
      timeout: 5s
      retries: 60
      start_period: 5s
    volumes:
      - ../packages/test-server/server-logs:/usr/src/app/logs

  test-server:
    build:
      context: ../packages/test-server/
      dockerfile: Dockerfile
    depends_on:
      wwl-server:
        # Without this the tests can start before the server is listening, and
        # a server that died on startup shows up as an unresolvable hostname
        # rather than as the failure it is
        condition: service_healthy
    environment:
      DEFAULT_API_KEY: "DEFAULT_API_KEY"
      WWL_SERVER_URL: "http://wwl-server:8787"
    volumes:
      - ../packages/test-server:/usr/src/app

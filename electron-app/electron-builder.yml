appId: "com.worldwidelab.app"
productName: "World-Wide-Lab"
asar: true
artifactName: "${productName}-${os}-${arch}.${ext}"
directories:
  buildResources: resources
# Without an explicit list, electron-builder ships every file of every
# production dependency. Around 44% of that payload is never read at runtime,
# the bulk of it coming from the generated Pulumi SDKs (see #97).
files:
  - "**/*"
  # Type declarations are only consumed by the TypeScript compiler (~291 MB).
  - "!**/*.d.ts"
  - "!**/*.d.mts"
  - "!**/*.d.cts"
  # Source maps (~52 MB).
  - "!**/*.map"
  # Incremental-build artefacts accidentally published by some packages (~8 MB).
  - "!**/tsconfig.tsbuildinfo"
  # Documentation (~10 MB). Licence files are deliberately kept, they only
  # rarely carry a .md extension and are re-included below where they do.
  - "!**/*.md"
  - "**/{LICENSE,LICENCE,COPYING,NOTICE}*"
mac:
  hardenedRuntime: true
  entitlements: "build/entitlements.mac.plist"
  entitlementsInherit: "build/entitlements.mac.plist"
  target:
    target: dmg
    arch:
      - x64
      - arm64
win:
  target: portable
linux:
  target: AppImage
  # There seems to be a bug where executableName
  # does not default to productName on Linux
  executableName: "World-Wide-Lab"

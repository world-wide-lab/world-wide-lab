name: Build & Release Electron App

on:
  # Run manually
  workflow_dispatch:
  # Run for any new tag starting with "v" e.g. "v1.2.3"
  push:
    tags:
      - "v*"
    branches:
      - feature/electron/*

# Sets permissions of the GITHUB_TOKEN to allow creating releases
permissions:
  contents: write

jobs:
  build-electron:
    runs-on: ${{ matrix.os }}
    env:
        NODE_OPTIONS: "--max-old-space-size=4096"

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      # Temporary workaround for #72, till the issue is fixed in sqlite3 package
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pango dependency
        if: matrix.os == 'macos-latest'
        run: |
          brew install pango
      # End of workaround

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install Electron dependencies
        working-directory: ./electron-app
        run: npm ci

      - name: Build Electron App
        working-directory: ./electron-app
        # bash on every platform, so that $PUBLISH_POLICY expands on Windows too
        shell: bash
        run: |
          npm run prebuild
          npm run build:wwl
          npx electron-builder --publish "$PUBLISH_POLICY"
        env:
          # electron-builder's default policy is "onTagOrDraft", which uploads
          # artifacts whenever a draft release exists - even for a build that
          # was triggered from a branch or run manually. Only ever publish when
          # we are genuinely building a release tag.
          PUBLISH_POLICY: ${{ startsWith(github.ref, 'refs/tags/v') && 'onTagOrDraft' || 'never' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-app-${{ matrix.os }}
          path: |
            electron-app/dist/*.exe
            electron-app/dist/*.dmg
            electron-app/dist/*.AppImage

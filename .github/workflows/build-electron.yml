name: Build & Release Electron App

on:
  # Run manually
  workflow_dispatch:
  # Run for any new tag starting with "v" e.g. "v1.2.3"
  push:
    tags:
      - "v*"
    branches:
      - feature/electron/*

# Sets permissions of the GITHUB_TOKEN to allow creating releases
permissions:
  contents: write

jobs:
  build-electron:
    runs-on: ${{ matrix.os }}
    env:
        NODE_OPTIONS: "--max-old-space-size=4096"

    strategy:
      # One platform failing should not cancel the builds for the others -
      # they are independent artifacts, and a toolchain problem on a single
      # runner would otherwise hide whether the other two are fine.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      # Temporary workaround for #72, till the issue is fixed in sqlite3 package
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pango dependency
        if: matrix.os == 'macos-latest'
        run: |
          brew install pango
      # End of workaround

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install Electron dependencies
        working-directory: ./electron-app
        run: npm ci

      - name: Build Electron App
        working-directory: ./electron-app
        # bash on every platform, so that $PUBLISH_POLICY expands on Windows too
        shell: bash
        run: |
          npm run prebuild
          npm run build:wwl
          npm run check:pulumi-modules
          npx electron-builder --publish "$PUBLISH_POLICY"
        env:
          # electron-builder's default policy is "onTagOrDraft", which uploads
          # artifacts whenever a draft release exists - even for a build that
          # was triggered from a branch or run manually. Only ever publish when
          # we are genuinely building a release tag.
          PUBLISH_POLICY: ${{ startsWith(github.ref, 'refs/tags/v') && 'onTagOrDraft' || 'never' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report app size
        if: always()
        working-directory: ./electron-app
        shell: bash
        run: |
          {
            echo "### Packaged size — ${{ matrix.os }}"
            echo
            echo '| What | Size |'
            echo '| --- | --- |'
            # Installers (what users download)
            for f in dist/*.dmg dist/*.exe dist/*.AppImage; do
              if [ -f "$f" ]; then
                printf '| %s | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
              fi
            done
            # Unpacked trees (what users end up with on disk, see #97)
            for d in dist/*-unpacked dist/mac dist/mac-arm64; do
              if [ -d "$d" ]; then
                printf '| %s/ (installed) | %s |\n' "$(basename "$d")" "$(du -sh "$d" | cut -f1)"
                # Split that between our own payload and the Electron runtime,
                # so a size regression can be attributed to one or the other.
                for asar in $(find "$d" -name app.asar 2>/dev/null); do
                  printf '| &nbsp;&nbsp;of which app.asar (our code + deps) | %s |\n' \
                    "$(du -h "$asar" | cut -f1)"
                done
              fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-app-${{ matrix.os }}
          path: |
            electron-app/dist/*.exe
            electron-app/dist/*.dmg
            electron-app/dist/*.AppImage
